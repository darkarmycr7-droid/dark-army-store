# Dark-Army Store — production stack (PostgreSQL + backend + frontend + Nginx)
# 1) cp .env.docker.example .env  and edit the secrets
# 2) docker compose up -d --build
# 3) open http://<your-server>   (Nginx → frontend → backend)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-darkarmy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-darkarmy}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-darkarmy}']
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-darkarmy}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-darkarmy}?schema=public
      PORT: '4000'
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-32-chars}
      JWT_EXPIRES_IN: '7d'
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost}
      STORAGE_DRIVER: local
      PUBLIC_BASE_URL: ${PUBLIC_URL:-http://localhost}
      PAYMENT_METHODS: ${PAYMENT_METHODS:-COD,STUB}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-console}
      MAIL_FROM: ${MAIL_FROM:-Dark-Army Store <no-reply@darkarmy.store>}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      OTP_TTL_MINUTES: '10'
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      STORE_NAME: ${STORE_NAME:-Dark-Army Store}
      CURRENCY: KD
      FREE_SHIPPING_OVER: ${FREE_SHIPPING_OVER:-20}
      DEFAULT_SHIPPING: ${DEFAULT_SHIPPING:-1.5}
      # Set true for the FIRST run only, then change to false and re-up
      SEED_ON_START: ${SEED_ON_START:-false}
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_ORIGIN: http://backend:4000
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_URL:-http://localhost}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: '3200'
      BACKEND_ORIGIN: http://backend:4000

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - '80:80'
      # - '443:443'   # enable for HTTPS (see DEPLOY.md)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  pgdata:
  uploads:

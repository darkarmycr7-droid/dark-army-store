# Nginx reverse proxy → Next.js frontend (which proxies /api and /uploads
# to the backend). Single entry point on port 80. Uncomment the HTTPS server
# and the 443 port in docker-compose.yml after obtaining certificates.

upstream darkarmy_frontend {
    server frontend:3200;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 12m;   # allow product image uploads
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location / {
        proxy_pass http://darkarmy_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

